name: Validate F1 analysis
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install analysis dependencies
        run: Rscript setup.R
      - name: Run analysis and validate outputs
        run: Rscript tests/validate.R
